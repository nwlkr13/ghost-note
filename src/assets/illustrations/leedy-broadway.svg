<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Leedy professional snare, nickel over brass (late 1920s)
  Original isometric vector. Badge shapes only: no lettering, no logo artwork.
  5 x 14. Nickel-plated brass with a center bead, separate-tension tube lugs, extended flange hoops, calfskin, side throw-off. The Broadway name is the catalog model; late-1920s Leedy professionals used this hardware. No claw hooks and no lettering.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Late 1920s nickel over brass snare, isometric view">
  <defs>
    <radialGradient id="ld-cymbal" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#c4a15a"/>
      <stop offset="0.45" stop-color="#7a5a28"/>
      <stop offset="1" stop-color="#3a2810"/>
    </radialGradient>
    <radialGradient id="ld-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ld-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eaec"/>
      <stop offset="0.45" stop-color="#8e949c"/>
      <stop offset="1" stop-color="#2a2e32"/>
    </linearGradient>
    <linearGradient id="ld-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d7a0"/>
      <stop offset="0.45" stop-color="#b8883c"/>
      <stop offset="1" stop-color="#5a3c18"/>
    </linearGradient>
    <linearGradient id="ld-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cfc6"/>
      <stop offset="0.5" stop-color="#8e8880"/>
      <stop offset="1" stop-color="#3a3834"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="322" rx="170" ry="14" fill="url(#ld-floor)"/>
  <!-- nickel over brass, separate tension -->
    <g>
      <line x1="199" y1="222" x2="52" y2="336" stroke="#7a756c" stroke-width="1.6"/>
      <line x1="240" y1="224" x2="240" y2="336" stroke="#7a756c" stroke-width="1.6"/>
      <line x1="281" y1="222" x2="428" y2="336" stroke="#7a756c" stroke-width="1.6"/>
      <path d="M94 124 L94 214 A146 38 0 0 0 386 214 L386 124 Z" fill="url(#ld-shell)" stroke="#4a463f" stroke-width="1.15"/>
