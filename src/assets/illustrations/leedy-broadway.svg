<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Leedy Broadway (1928)
  Isometric, geometric, dark aesthetic.
  5 x 14 antique snare. Nickel plate over brass: dull nickel shell, brass showing at the top and bottom edges. Claw hooks over a calfskin head. Separate-tension hardware, no modern turret lugs.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Leedy Broadway snare, isometric view">
  <defs>
    <radialGradient id="ld-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="ld-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ld-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="ld-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cfc6"/>
      <stop offset="0.45" stop-color="#8e8880"/>
      <stop offset="1" stop-color="#3e3a36"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="320" rx="180" ry="16" fill="url(#ld-floor)"/>
  <!-- broadway snare 5 x 14 -->
    <g>
      <line x1="192" y1="226" x2="48" y2="334" stroke="#7a756e" stroke-width="1.5"/>
      <line x1="240" y1="228" x2="240" y2="334" stroke="#7a756e" stroke-width="1.5"/>
