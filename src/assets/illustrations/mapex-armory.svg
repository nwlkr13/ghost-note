<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Mapex Armory (2014)
  Isometric, geometric, dark aesthetic.
  18 x 22 bass, offset 10 x 10 and 12 x 14 toms, 14 x 16 floor. Rainforest burst. Asymmetric modern layout. Pale inner ring marks the SONIClear bearing edge. Chrome hardware.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Mapex Armory drum kit, isometric view">
  <defs>
    <radialGradient id="mx-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="mx-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mx-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="mx-shell" x1="0" y1="0" x2="1" y2="0">
