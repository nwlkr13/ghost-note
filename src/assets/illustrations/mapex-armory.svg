<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Mapex Armory, Rainforest Burst (2014)
  Original isometric vector. Badge shapes only: no lettering, no logo artwork.
  Catalog sizes 18x22 bass, 10x10 and 12x14 toms, 14x16 floor. Green-black burst, sharp tube lugs, thicker power hoops, rounded bearing-edge lip. Rectangular badge outline only.
-->
