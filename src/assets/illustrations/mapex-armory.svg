      <stop offset="0.24" stop-color="#143828"/>
      <stop offset="0.5" stop-color="#c8ecd4"/>
      <stop offset="0.76" stop-color="#143828"/>
      <stop offset="1" stop-color="#08110e"/>
    </linearGradient>
  </defs>
