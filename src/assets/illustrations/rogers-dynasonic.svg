<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Rogers Dynasonic (1958)
  Isometric, geometric, dark aesthetic.
  5 x 14 chrome-over-brass snare. Brass shell, chrome hoops, Swivo-style short lugs. The parallel strainer is the frame under the shell, with a side throw-off.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Rogers Dynasonic snare, isometric view">
  <defs>
