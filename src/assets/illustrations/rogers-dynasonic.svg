<!--
  Ghost Note — Rogers Dyna-Sonic, chrome over brass (late 1950s)
  Original isometric vector. Badge shapes only: no lettering, no logo artwork.
  5 x 14. Brass shell with five engraved lines, ten beavertail lugs, tall hoops, empty oval badge, floating snare frame and single tension screw underneath.
-->
