      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="rg-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rg-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rg-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d7a0"/>
      <stop offset="0.4" stop-color="#c4984c"/>
      <stop offset="1" stop-color="#5a3c18"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="320" rx="180" ry="16" fill="url(#rg-floor)"/>
  <!-- dynasonic 5 x 14 -->
    <g>
