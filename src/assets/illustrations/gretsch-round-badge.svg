<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Gretsch Round Badge (1957)
  Isometric, geometric, dark aesthetic.
  Jazz kit. 14 x 20 bass, one 8 x 12 rack tom, 14 x 14 floor. Copper Mist lacquer, nickel hardware, calfskin heads. Gold round badge on the bass head.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Gretsch Round Badge drum kit, isometric view">
