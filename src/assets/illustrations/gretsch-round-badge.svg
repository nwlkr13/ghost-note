<!--
  Ghost Note — Gretsch Round Badge Progressive Jazz, Copper Mist (late 1950s)
  Original isometric vector. Badge shapes only: no lettering, no logo artwork.
  20x14 bass, 12x8 rack, 14x14 floor, shallow snare. Die-cast hoops, slim lugs, round badge outline on the shell with no lettering, rail tom mount, copper mist sparkle, lightning-style side throw on the snare.
-->
