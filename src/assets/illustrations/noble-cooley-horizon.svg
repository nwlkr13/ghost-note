      <line x1="270" y1="154" x2="270" y2="182" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="286" y1="154" x2="286" y2="182" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="302" y1="154" x2="302" y2="182" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="318" y1="154" x2="318" y2="182" stroke="#e2c78a" stroke-width="1.15"/>
      <ellipse cx="286" cy="152" rx="42" ry="11" fill="#0e0805" stroke="#d4b15e" stroke-width="2"/>
