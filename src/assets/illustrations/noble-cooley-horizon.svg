      <line x1="90" y1="254" x2="90" y2="280" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="102" y1="254" x2="102" y2="280" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="114" y1="254" x2="114" y2="280" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="126" y1="254" x2="126" y2="280" stroke="#e2c78a" stroke-width="1.15"/>
      <line x1="138" y1="254" x2="138" y2="280" stroke="#e2c78a" stroke-width="1.15"/>
