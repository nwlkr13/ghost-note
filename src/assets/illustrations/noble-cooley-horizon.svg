      <ellipse cx="412" cy="152" rx="36" ry="9" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="412" cy="152" rx="25" ry="6" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="412" cy="152" rx="7" ry="2" fill="#1a1208"/>
