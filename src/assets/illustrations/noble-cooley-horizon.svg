<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Noble and Cooley Horizon (2003)
  Isometric, geometric, dark aesthetic.
  16 x 22 bass, small 7 x 10 and 8 x 12 toms, 14 x 14 floor. Steam-bent walnut, gloss highlight, brass hardware. No stave seams: one continuous shell.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Noble and Cooley Horizon drum kit, isometric view">
  <defs>
    <radialGradient id="nc-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="nc-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nc-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="nc-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4e3a"/>
      <stop offset="0.4" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#120c08"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="332" rx="210" ry="20" fill="url(#nc-floor)"/>
  <!-- crash -->
    <g>
      <line x1="76" y1="133" x2="88" y2="334" stroke="#8a7040" stroke-width="1.4"/>
      <line x1="76" y1="133" x2="76" y2="116" stroke="#6a6a6a" stroke-width="1.1"/>
      <ellipse cx="76" cy="130" rx="32" ry="8" fill="url(#nc-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="76" cy="130" rx="24" ry="6" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="76" cy="130" rx="17" ry="4" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="76" cy="130" rx="5" ry="2" fill="#1a1208"/>
    </g>
  <!-- ride -->
    <g>
      <line x1="412" y1="156" x2="398" y2="334" stroke="#8a7040" stroke-width="1.4"/>
      <line x1="412" y1="156" x2="412" y2="134" stroke="#6a6a6a" stroke-width="1.1"/>
