      <ellipse cx="42" cy="219" rx="4" ry="2" fill="#1a1208"/>
      <ellipse cx="42" cy="214" rx="26" ry="6" fill="url(#nc-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="42" cy="214" rx="17" ry="4" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="42" cy="214" rx="4" ry="2" fill="#1a1208"/>
    </g>
</svg>
