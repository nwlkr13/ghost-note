<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Zildjian A Series (1623)
  Isometric, geometric, dark aesthetic.
  Cymbals only: 14 inch hi-hats, 17 inch crash, 20 inch ride. Traditional bell bronze, lathed. No drums.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Zildjian A Series cymbal set, isometric view">
  <defs>
    <radialGradient id="zi-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="zi-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zi-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>

  </defs>
  <ellipse cx="240" cy="332" rx="210" ry="20" fill="url(#zi-floor)"/>
  <!-- crash 17 inch -->
    <g>
      <line x1="236" y1="138" x2="254" y2="334" stroke="#5a5044" stroke-width="1.4"/>
      <line x1="236" y1="138" x2="236" y2="110" stroke="#6a6a6a" stroke-width="1.1"/>
      <ellipse cx="236" cy="132" rx="68" ry="16" fill="url(#zi-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="236" cy="132" rx="58" ry="14" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="236" cy="132" rx="48" ry="11" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="236" cy="132" rx="39" ry="9" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="236" cy="132" rx="29" ry="7" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="236" cy="132" rx="10" ry="3" fill="#1a1208"/>
    </g>
  <!-- ride 20 inch -->
    <g>
      <line x1="378" y1="203" x2="358" y2="334" stroke="#5a5044" stroke-width="1.4"/>
      <line x1="378" y1="203" x2="378" y2="170" stroke="#6a6a6a" stroke-width="1.1"/>
      <ellipse cx="378" cy="196" rx="84" ry="20" fill="url(#zi-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="378" cy="196" rx="72" ry="17" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="378" cy="196" rx="60" ry="14" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="378" cy="196" rx="48" ry="11" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="378" cy="196" rx="36" ry="8" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="378" cy="196" rx="13" ry="4" fill="#1a1208"/>
    </g>
  <!-- hi-hat 14 inch -->
    <g>
      <line x1="92" y1="212" x2="92" y2="334" stroke="#8a847c" stroke-width="1.4"/>
      <ellipse cx="92" cy="214" rx="52" ry="12" fill="url(#zi-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="92" cy="214" rx="40" ry="9" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="92" cy="214" rx="27" ry="6" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="92" cy="214" rx="8" ry="2" fill="#1a1208"/>
      <ellipse cx="92" cy="208" rx="52" ry="12" fill="url(#zi-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="92" cy="208" rx="40" ry="9" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="92" cy="208" rx="27" ry="6" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="92" cy="208" rx="8" ry="2" fill="#1a1208"/>
    </g>
</svg>
