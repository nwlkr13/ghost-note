<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Craviotto Solid Maple (1996)
  Isometric, geometric, dark aesthetic.
  Three solid-stave maple snares, 5.5, 6, and 7 inches deep. Vertical stave seams, satin maple, brass hardware, on a display plinth. No ply lines.
-->
