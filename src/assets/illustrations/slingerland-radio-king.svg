<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Slingerland Radio King (1936)
  Isometric, geometric, dark aesthetic.
  5 x 14 one-piece maple snare. Smooth amber shell, no stave seams. Calfskin head, nickel hardware, dark badge plate on the shell.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Slingerland Radio King snare, isometric view">
  <defs>
    <radialGradient id="sl-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="sl-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="sl-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c48a"/>
      <stop offset="0.45" stop-color="#b07840"/>
      <stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="320" rx="180" ry="16" fill="url(#sl-floor)"/>
  <!-- radio king snare 5 x 14 -->
