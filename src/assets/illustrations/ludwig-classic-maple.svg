<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Ludwig Classic / Super Classic, Oyster Black Pearl (mid-1960s)
  Original isometric vector. Badge shapes only: no lettering, no logo artwork.
  Catalog sizes 14x22 bass, 8x12 and 9x13 racks, 16x16 floor. Oyster black pearl swirls, long imperial lugs, triple-flange hoops on toms, wood bass hoops with inlay and claws, empty keystone badge outline on the shell, calfskin heads. Metal snare in the Super Classic pattern.
-->
