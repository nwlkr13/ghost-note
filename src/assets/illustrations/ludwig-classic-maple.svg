<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Ludwig Classic Maple (1965)
  Isometric, geometric, dark aesthetic.
  Oyster Black Pearl finish; chrome hardware; blood-red Ludwig accent rings.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Ludwig Classic Maple drum kit, isometric view">
  <defs>
    <linearGradient id="gn-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c18"/>
      <stop offset="1" stop-color="#0c0807"/>
    </linearGradient>
    <linearGradient id="gn-shell-tom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241612"/>
      <stop offset="1" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="gn-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <linearGradient id="gn-snare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="gn-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="240" cy="330" rx="220" ry="22" fill="url(#gn-floor)"/>

  <!-- crash cymbal stand (back-left) -->
  <line x1="78" y1="148" x2="92" y2="330" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="78" y1="148" x2="78" y2="118" stroke="#5a5a5a" stroke-width="1"/>
  <!-- crash cymbal -->
  <ellipse cx="78" cy="138" rx="38" ry="9" fill="url(#gn-cymbal)" stroke="#1a1208" stroke-width="0.8"/>
  <ellipse cx="78" cy="138" rx="22" ry="5" fill="none" stroke="#5a4118" stroke-width="0.5"/>
  <ellipse cx="78" cy="138" rx="6" ry="1.5" fill="#1a1208"/>

  <!-- ride cymbal stand (back-right) -->
  <line x1="408" y1="172" x2="392" y2="330" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="408" y1="172" x2="408" y2="142" stroke="#5a5a5a" stroke-width="1"/>
  <!-- ride cymbal -->
  <ellipse cx="408" cy="162" rx="46" ry="11" fill="url(#gn-cymbal)" stroke="#1a1208" stroke-width="0.8"/>
  <ellipse cx="408" cy="162" rx="28" ry="6.5" fill="none" stroke="#5a4118" stroke-width="0.5"/>
  <ellipse cx="408" cy="162" rx="8" ry="2" fill="#1a1208"/>

  <!-- floor tom (right) -->
  <g>
    <!-- legs -->
    <line x1="356" y1="296" x2="348" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <line x1="424" y1="296" x2="432" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <!-- shell side -->
    <path d="M338 250 L338 296 A52 12 0 0 0 442 296 L442 250 Z" fill="url(#gn-shell-tom)" stroke="#1a0e0a" stroke-width="0.8"/>
    <!-- vertical lugs -->
    <line x1="356" y1="252" x2="356" y2="294" stroke="#888" stroke-width="0.6"/>
    <line x1="390" y1="254" x2="390" y2="296" stroke="#888" stroke-width="0.6"/>
    <line x1="424" y1="252" x2="424" y2="294" stroke="#888" stroke-width="0.6"/>
    <!-- top hoop (Ludwig red) -->
    <ellipse cx="390" cy="250" rx="52" ry="12" fill="#0e0805" stroke="#c0392b" stroke-width="1.5"/>
    <ellipse cx="390" cy="250" rx="48" ry="11" fill="#1a1410" stroke="#3a2a22" stroke-width="0.5"/>
    <circle cx="390" cy="250" r="1.6" fill="#c0392b"/>
  </g>

  <!-- bass drum (center) -->
  <g>
    <!-- shell side -->
    <path d="M118 232 L118 290 A124 32 0 0 0 366 290 L366 232 Z" fill="url(#gn-shell)" stroke="#1a0e0a" stroke-width="0.8"/>
    <!-- vertical chrome lug strips -->
    <line x1="148" y1="234" x2="148" y2="288" stroke="#8a8a8a" stroke-width="0.7"/>
    <line x1="190" y1="236" x2="190" y2="290" stroke="#8a8a8a" stroke-width="0.7"/>
    <line x1="232" y1="237" x2="232" y2="291" stroke="#8a8a8a" stroke-width="0.7"/>
    <line x1="274" y1="236" x2="274" y2="290" stroke="#8a8a8a" stroke-width="0.7"/>
    <line x1="316" y1="234" x2="316" y2="288" stroke="#8a8a8a" stroke-width="0.7"/>
    <line x1="358" y1="232" x2="358" y2="286" stroke="#8a8a8a" stroke-width="0.7"/>
    <!-- top hoop (red Ludwig accent) -->
    <ellipse cx="242" cy="232" rx="124" ry="32" fill="#0d0807" stroke="#c0392b" stroke-width="2"/>
    <ellipse cx="242" cy="232" rx="118" ry="30" fill="#1a1410" stroke="#3a2a22" stroke-width="0.5"/>
    <!-- subtle Oyster Black Pearl swirl on head -->
    <ellipse cx="220" cy="226" rx="40" ry="10" fill="#221a16" opacity="0.6"/>
    <ellipse cx="270" cy="236" rx="30" ry="8" fill="#221a16" opacity="0.4"/>
    <!-- center logo -->
    <circle cx="242" cy="232" r="5" fill="#0a0606" stroke="#c0392b" stroke-width="1.2"/>
    <circle cx="242" cy="232" r="1.5" fill="#c0392b"/>
  </g>

  <!-- left rack tom (mounted on bass) -->
  <g>
    <path d="M152 188 L152 218 A40 10 0 0 0 232 218 L232 188 Z" fill="url(#gn-shell-tom)" stroke="#1a0e0a" stroke-width="0.7"/>
    <line x1="170" y1="190" x2="170" y2="216" stroke="#888" stroke-width="0.6"/>
    <line x1="192" y1="192" x2="192" y2="218" stroke="#888" stroke-width="0.6"/>
    <line x1="214" y1="190" x2="214" y2="216" stroke="#888" stroke-width="0.6"/>
    <ellipse cx="192" cy="188" rx="40" ry="10" fill="#0e0805" stroke="#c0392b" stroke-width="1.3"/>
    <ellipse cx="192" cy="188" rx="36" ry="9" fill="#1a1410" stroke="#3a2a22" stroke-width="0.5"/>
    <circle cx="192" cy="188" r="1.4" fill="#c0392b"/>
  </g>

  <!-- right rack tom -->
  <g>
    <path d="M252 184 L252 214 A40 10 0 0 0 332 214 L332 184 Z" fill="url(#gn-shell-tom)" stroke="#1a0e0a" stroke-width="0.7"/>
    <line x1="270" y1="186" x2="270" y2="212" stroke="#888" stroke-width="0.6"/>
    <line x1="292" y1="188" x2="292" y2="214" stroke="#888" stroke-width="0.6"/>
    <line x1="314" y1="186" x2="314" y2="212" stroke="#888" stroke-width="0.6"/>
    <ellipse cx="292" cy="184" rx="40" ry="10" fill="#0e0805" stroke="#c0392b" stroke-width="1.3"/>
    <ellipse cx="292" cy="184" rx="36" ry="9" fill="#1a1410" stroke="#3a2a22" stroke-width="0.5"/>
    <circle cx="292" cy="184" r="1.4" fill="#c0392b"/>
  </g>

  <!-- tom mount post on bass drum -->
  <line x1="242" y1="232" x2="242" y2="160" stroke="#5a5a5a" stroke-width="1.2"/>

  <!-- snare drum (left foreground) on stand -->
  <g>
    <!-- stand legs -->
    <line x1="100" y1="270" x2="84" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <line x1="124" y1="272" x2="124" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <line x1="148" y1="270" x2="164" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <!-- shell -->
    <path d="M86 250 L86 270 A38 9 0 0 0 162 270 L162 250 Z" fill="url(#gn-snare)" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="100" y1="252" x2="100" y2="268" stroke="#bbb" stroke-width="0.6"/>
    <line x1="124" y1="254" x2="124" y2="270" stroke="#bbb" stroke-width="0.6"/>
    <line x1="148" y1="252" x2="148" y2="268" stroke="#bbb" stroke-width="0.6"/>
    <!-- top hoop -->
    <ellipse cx="124" cy="250" rx="38" ry="9" fill="#0e0805" stroke="#c0392b" stroke-width="1.3"/>
    <ellipse cx="124" cy="250" rx="34" ry="8" fill="#1a1410" stroke="#3a2a22" stroke-width="0.5"/>
    <circle cx="124" cy="250" r="1.4" fill="#c0392b"/>
  </g>

  <!-- hi-hat (far left) -->
  <g>
    <line x1="38" y1="232" x2="38" y2="332" stroke="#9a9a9a" stroke-width="1.2"/>
    <ellipse cx="38" cy="220" rx="26" ry="6" fill="url(#gn-cymbal)" stroke="#1a1208" stroke-width="0.7"/>
    <ellipse cx="38" cy="226" rx="26" ry="6" fill="url(#gn-cymbal)" stroke="#1a1208" stroke-width="0.7"/>
    <ellipse cx="38" cy="220" rx="14" ry="3" fill="none" stroke="#5a4118" stroke-width="0.4"/>
  </g>

  <!-- bass drum pedal hint -->
  <line x1="242" y1="290" x2="242" y2="328" stroke="#5a5a5a" stroke-width="1"/>
  <rect x="232" y="324" width="20" height="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- subtle scanlines / film grain hint -->
  <rect x="0" y="0" width="480" height="360" fill="none"/>
</svg>
