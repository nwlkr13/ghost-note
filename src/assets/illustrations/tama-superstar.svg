<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghost Note — Tama Superstar (1976)
  Isometric, geometric, dark aesthetic.
  14 x 22 bass, 10 x 13 and 11 x 14 rack toms, 16 x 16 floor. Cherry sunburst shells. Star-Cast mounts drawn as stars on the rack toms. Chrome hardware.
-->
<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Tama Superstar drum kit, isometric view">
  <defs>
    <radialGradient id="tm-cymbal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4ad57"/>
      <stop offset="0.55" stop-color="#8a6627"/>
      <stop offset="1" stop-color="#3d2c11"/>
    </radialGradient>
    <radialGradient id="tm-floor" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tm-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="tm-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#100408"/>
      <stop offset="0.22" stop-color="#5a1828"/>
      <stop offset="0.5" stop-color="#f0a0aa"/>
      <stop offset="0.78" stop-color="#5a1828"/>
      <stop offset="1" stop-color="#100408"/>
    </linearGradient>
  </defs>
  <ellipse cx="240" cy="332" rx="210" ry="20" fill="url(#tm-floor)"/>
  <!-- crash -->
    <g>
      <line x1="70" y1="129" x2="82" y2="334" stroke="#6a6a6a" stroke-width="1.4"/>
      <line x1="70" y1="129" x2="70" y2="111" stroke="#6a6a6a" stroke-width="1.1"/>
      <ellipse cx="70" cy="126" rx="36" ry="9" fill="url(#tm-cymbal)" stroke="#1a1208" stroke-width="1"/>
      <ellipse cx="70" cy="126" rx="27" ry="7" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="70" cy="126" rx="19" ry="5" fill="none" stroke="#5a4118" stroke-width="0.8"/>
      <ellipse cx="70" cy="126" rx="5" ry="2" fill="#1a1208"/>
