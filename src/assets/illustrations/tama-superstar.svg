      <line x1="271" y1="152" x2="271" y2="192" stroke="#d5d5d5" stroke-width="1.15"/>
      <line x1="287" y1="152" x2="287" y2="192" stroke="#d5d5d5" stroke-width="1.15"/>
      <line x1="304" y1="152" x2="304" y2="192" stroke="#d5d5d5" stroke-width="1.15"/>
      <line x1="320" y1="152" x2="320" y2="192" stroke="#d5d5d5" stroke-width="1.15"/>
