    <g>
      <line x1="420" y1="154" x2="406" y2="334" stroke="#6a6a6a" stroke-width="1.4"/>
      <line x1="420" y1="154" x2="420" y2="132" stroke="#6a6a6a" stroke-width="1.1"/>
